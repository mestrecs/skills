<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-label="Terminal replay: a chat set to Codex denies a Claude subagent, hits Codex quota ceiling exit 3, then retries with CLAUDE-ONLY: ceiling and logs the exception">
<style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:12.5px;white-space:pre}@keyframes k0{0%,2.00%{opacity:0}3.20%,92%{opacity:1}96%,100%{opacity:0}}.l0{opacity:0;animation:k0 24s infinite}@keyframes k1{0%,7.00%{opacity:0}8.20%,92%{opacity:1}96%,100%{opacity:0}}.l1{opacity:0;animation:k1 24s infinite}@keyframes k2{0%,12.50%{opacity:0}13.70%,92%{opacity:1}96%,100%{opacity:0}}.l2{opacity:0;animation:k2 24s infinite}@keyframes k3{0%,15.50%{opacity:0}16.70%,92%{opacity:1}96%,100%{opacity:0}}.l3{opacity:0;animation:k3 24s infinite}@keyframes k4{0%,22.00%{opacity:0}23.20%,92%{opacity:1}96%,100%{opacity:0}}.l4{opacity:0;animation:k4 24s infinite}@keyframes k5{0%,26.00%{opacity:0}27.20%,92%{opacity:1}96%,100%{opacity:0}}.l5{opacity:0;animation:k5 24s infinite}@keyframes k6{0%,33.00%{opacity:0}34.20%,92%{opacity:1}96%,100%{opacity:0}}.l6{opacity:0;animation:k6 24s infinite}@keyframes k7{0%,38.00%{opacity:0}39.20%,92%{opacity:1}96%,100%{opacity:0}}.l7{opacity:0;animation:k7 24s infinite}@keyframes k8{0%,42.00%{opacity:0}43.20%,92%{opacity:1}96%,100%{opacity:0}}.l8{opacity:0;animation:k8 24s infinite}@keyframes k9{0%,50.00%{opacity:0}51.20%,92%{opacity:1}96%,100%{opacity:0}}.l9{opacity:0;animation:k9 24s infinite}@keyframes k10{0%,54.50%{opacity:0}55.70%,92%{opacity:1}96%,100%{opacity:0}}.l10{opacity:0;animation:k10 24s infinite}@keyframes k11{0%,62.00%{opacity:0}63.20%,92%{opacity:1}96%,100%{opacity:0}}.l11{opacity:0;animation:k11 24s infinite}@keyframes k12{0%,67.00%{opacity:0}68.20%,92%{opacity:1}96%,100%{opacity:0}}.l12{opacity:0;animation:k12 24s infinite}@keyframes k13{0%,72.00%{opacity:0}73.20%,92%{opacity:1}96%,100%{opacity:0}}.l13{opacity:0;animation:k13 24s infinite}@keyframes k14{0%,79.00%{opacity:0}80.20%,92%{opacity:1}96%,100%{opacity:0}}.l14{opacity:0;animation:k14 24s infinite}</style>
<rect width="900" height="480" rx="10" fill="#0d1117"/>
<rect width="900" height="36" rx="10" fill="#161b22"/><rect y="26" width="900" height="10" fill="#161b22"/>
<circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
<text x="450" y="23" text-anchor="middle" fill="#8b949e" font-size="12">per-chat helper guard and quota fallback</text>
<text x="24" y="62" fill="#3fb950">$</text><text x="40" y="62" fill="#e6edf3">node engine-switch.cjs --chat c7f2 helper codex "use codex helpers"</text>
<text class="l0" x="24" y="88" fill="#8b949e">chat c7f2 | helper=codex (saved to ~/.engine-switch/chats/c7f2.json)</text>
<text class="l1" x="24" y="114" fill="#e6edf3">chat tries to spawn a Claude subagent: Agent(prompt="inspect auth module")</text>
<text class="l2" x="24" y="134" fill="#f778ba">engine-guard | DENY Agent: helper engine is CODEX</text>
<text class="l3" x="24" y="154" fill="#8b949e">             | include CLAUDE-ONLY: ceiling or CLAUDE-ONLY: tool &lt;name&gt;</text>
<text class="l4" x="24" y="182" fill="#e6edf3">chat delegates the helper task to Codex instead:</text>
<text class="l5" x="24" y="202" fill="#58a6ff">$ node run-codex.cjs ../my-app-wt/auth request.md answer.txt</text>
<text class="l6" x="24" y="224" fill="#ffbd2e">codex | [quota] windowPct=95% (&gt;= 90% cap) — quota ceiling reached</text>
<text class="l7" x="24" y="244" fill="#ffbd2e">codex | wrote ceiling marker: ~/.engine-switch/ceilings/codex.json</text>
<text class="l8" x="24" y="264" fill="#f778ba">codex | EXIT 3 (at quota ceiling)</text>
<text class="l9" x="24" y="292" fill="#e6edf3">chat retries with verified ceiling fallback:</text>
<text class="l10" x="24" y="312" fill="#58a6ff">Agent(prompt="CLAUDE-ONLY: ceiling\ninspect auth module")</text>
<text class="l11" x="24" y="334" fill="#8b949e">engine-guard | verified recent marker ceilings/codex.json (age 4s)</text>
<text class="l12" x="24" y="354" fill="#7ee787">engine-guard | ALLOW exception=ceiling (logged)</text>
<text class="l13" x="24" y="382" fill="#8b949e">~/.engine-switch/claude-exceptions.jsonl: {"sessionId":"c7f2","engine":"codex","exception":"ceiling"}</text>
<text class="l14" x="24" y="424" fill="#3fb950" font-weight="bold" font-size="16">GUARD + FALLBACK VERIFIED</text>
</svg>
