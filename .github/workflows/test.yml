name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git identity for the tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Run the script tests for every skill
        shell: bash
        run: |
          set -euo pipefail
          for d in skills/*/scripts/test; do
            echo "=== Testing $d ==="
            (cd "$(dirname "$(dirname "$d")")" && node --test scripts/test/)
          done
